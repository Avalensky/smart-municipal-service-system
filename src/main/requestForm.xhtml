<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Municipal Service Request</title>
</head>
<body>
    <h2>Log a Municipal Service Request</h2>
    <form action="submitRequest" method="post">
        <label for="citizenName">Citizen Name:</label><br>
        <input type="text" id="citizenName" name="citizenName" required><br><br>

        <label for="requestType">Request Type:</label><br>
        <select id="requestType" name="requestType" required>
            <option value="Water Leak">Water Leak</option>
            <option value="Electricity Outage">Electricity Outage</option>
            <option value="Pothole Repair">Pothole Repair</option>
            <option value="Waste Collection">Waste Collection</option>
        </select><br><br>

        <label for="description">Description:</label><br>
        <textarea id="description" name="description" rows="4" cols="40" required></textarea><br><br>

        <button type="submit">Submit Request</button>
    </form>
</body>
</html>
